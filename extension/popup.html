<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h2>TokenWise</h2>

  <textarea
    id="prompt"
    placeholder="Enter prompt..."
  ></textarea>

  <div class="buttons">
<button id="enhanceBtn">Improve</button>
<button id="compressBtn">Compress</button>
<button id="smartBtn">Smart Optimize</button>
  </div>

  <textarea
    id="output"
    readonly
    placeholder="Output..."
  ></textarea>

<div class="metrics">
  <div class="metric-card">
    <div
      id="originalTokens"
      class="metric-value"
    >
      0
    </div>
    <div class="metric-label">
      Original
    </div>
  </div>

  <div class="metric-card">
    <div
      id="optimizedTokens"
      class="metric-value"
    >
      0
    </div>
    <div class="metric-label">
      Optimized
    </div>
  </div>

  <div class="metric-card">
    <div
      id="savedTokens"
      class="metric-value"
    >
      0%
    </div>
    <div class="metric-label">
      Saved
    </div>
  </div>
</div>

<button id="copyBtn" class="copy-btn">
  Copy Prompt
</button>

  <script src="popup.js"></script>
</body>
</html>
