<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h2>TokenWise</h2>

  <textarea
    id="prompt"
    placeholder="Enter prompt..."
  ></textarea>

  <div class="buttons">
    <button id="enhanceBtn">Enhance</button>
    <button id="optimizeBtn">Optimize</button>
  </div>

  <textarea
    id="output"
    readonly
    placeholder="Output..."
  ></textarea>

  <button id="copyBtn">
    Copy Prompt
  </button>

  <script src="popup.js"></script>
</body>
</html>
